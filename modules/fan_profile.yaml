script:
  - id: fan${fan}_apply_profile
    then:
      - lambda: |-
          if (id(fan${fan}_profile_mode) <= 0 || !id(auto_control_fan${fan}).state ||
              id(usr_override_fan${fan})) return;
          const float temperature = id(${temperature_sensor_id}).state;
          if (!std::isfinite(temperature)) return;
          struct Point { float temp; float speed; };
          Point points[5] = {
            {id(fan${fan}_curve_temp1).state, id(fan${fan}_curve_speed1).state},
            {id(fan${fan}_curve_temp2).state, id(fan${fan}_curve_speed2).state},
            {id(fan${fan}_curve_temp3).state, id(fan${fan}_curve_speed3).state},
            {id(fan${fan}_curve_temp4).state, id(fan${fan}_curve_speed4).state},
            {id(fan${fan}_curve_temp5).state, id(fan${fan}_curve_speed5).state}
          };
          for (int i = 0; i < 5; i++) {
            if (!std::isfinite(points[i].temp) || !std::isfinite(points[i].speed)) {
              id(curve_config_warning) = true;
              return;
            }
            if (i > 0 && points[i].temp <= points[i-1].temp)
              id(curve_config_warning) = true;
          }
          for (int i = 0; i < 4; i++) {
            for (int j = 0; j < 4-i; j++) {
              if (points[j].temp > points[j+1].temp) {
                Point tmp = points[j]; points[j] = points[j+1]; points[j+1] = tmp;
              }
            }
          }
          float effective = points[4].speed;
          if (temperature <= points[0].temp) effective = points[0].speed;
          else if (temperature < points[4].temp) {
            for (int i = 0; i < 4; i++) {
              if (temperature >= points[i].temp && temperature <= points[i+1].temp) {
                float range = points[i+1].temp - points[i].temp;
                effective = range <= 0.0001f ? points[i].speed :
                    points[i].speed + (temperature-points[i].temp) / range *
                    (points[i+1].speed-points[i].speed);
                break;
              }
            }
          }
          const float floor = id(fan${fan}_safety_floor);
          if (effective > 0.0f && effective < floor) effective = floor;
          if (effective <= 0.0f) id(fan${fan}).turn_off().perform();
          else {
            auto call = id(fan${fan}).turn_on();
            call.set_speed(effective);
            call.perform();
          }
