sensor:
  - platform: template
    name: $friendly_name Curve Output
    id: curve_output_value
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      float temp = id(fancontroller_temperature).state;

      float temps[5] = {
        id(axis_temp1).state,
        id(axis_temp2).state,
        id(axis_temp3).state,
        id(axis_temp4).state,
        id(axis_temp5).state
      };

      // The one and only axis check. Runs every cycle against the live number
      // states, because these are editable from Home Assistant. Since this
      // module never sorts, a non-ascending axis makes interpolation
      // meaningless, so run the fans flat out rather than too slowly.
      bool axis_ok = true;
      for (int i = 0; i < 4; i++) {
        if (temps[i] >= temps[i+1]) {
          axis_ok = false;
        }
      }
      if (!axis_ok) {
        if (!id(curve_axis_fault)) {
          ESP_LOGW("temperature_curve_triple",
            "FAULT: live temperature axis is not strictly ascending "
            "(%.1f, %.1f, %.1f, %.1f, %.1f). Running fans at 100%% until "
            "the points are corrected.",
            temps[0], temps[1], temps[2], temps[3], temps[4]);
        }
        id(curve_axis_fault) = true;
        return 100.0;
      }
      if (id(curve_axis_fault)) {
        ESP_LOGI("temperature_curve_triple",
          "Live temperature axis is ascending again, resuming normal control");
      }
      id(curve_axis_fault) = false;

      // Dispatch on the select index rather than the option string, so that
      // renaming a profile cannot break selection. An empty optional (no
      // option active yet) falls back to profile A.
      int profile = 0;
      auto active = id(curve_select).active_index();
      if (active.has_value()) {
        profile = active.value();
      }

      float speeds[5];
      if (profile == 1) {
        speeds[0] = id(curve_b_speed1).state;
        speeds[1] = id(curve_b_speed2).state;
        speeds[2] = id(curve_b_speed3).state;
        speeds[3] = id(curve_b_speed4).state;
        speeds[4] = id(curve_b_speed5).state;
      } else if (profile == 2) {
        speeds[0] = id(curve_c_speed1).state;
        speeds[1] = id(curve_c_speed2).state;
        speeds[2] = id(curve_c_speed3).state;
        speeds[3] = id(curve_c_speed4).state;
        speeds[4] = id(curve_c_speed5).state;
      } else {
        speeds[0] = id(curve_a_speed1).state;
        speeds[1] = id(curve_a_speed2).state;
        speeds[2] = id(curve_a_speed3).state;
        speeds[3] = id(curve_a_speed4).state;
        speeds[4] = id(curve_a_speed5).state;
      }

      // Points are never sorted. They must be entered in ascending order;
      // the live axis check above catches it when they are not.

      // Below first point: use first speed
      if (temp <= temps[0]) {
        return speeds[0];
      }
      // Above last point: use last speed
      if (temp >= temps[4]) {
        return speeds[4];
      }
      // Interpolate between the two surrounding points
      for (int i = 0; i < 4; i++) {
        if (temp >= temps[i] && temp <= temps[i+1]) {
          float temp_range = temps[i+1] - temps[i];
          if (temp_range <= 0.0001) {
            return speeds[i];
          }
          float ratio = (temp - temps[i]) / temp_range;
          return speeds[i] + ratio * (speeds[i+1] - speeds[i]);
        }
      }
      return 0.0;
    on_value:
      then:
        - output.set_level:
            id: curve_proxy_output
            level: !lambda 'return x / 100.0;'

# NOTE: The write_action lambda below is a verbatim copy of the one in
# modules/temperature_curve.yaml (per-fan auto_control + usr_override +
# safety_floor gating). ESPHome YAML cannot share lambda blocks across
# modules, so every temperature module duplicates it. Keep temperature_curve,
# temperature_linear, temperature_curve_dual and temperature_curve_triple in
# sync. temperature_pid deliberately differs and is not part of this set.
output:
  - platform: template
    id: curve_proxy_output
    type: float
    write_action:
      lambda: |-
        float write_val = state*100.0;

        if (id(auto_control_fan1).state) {
          if (!id(usr_override_fan1)) {
            float effective = write_val;
            float floor1 = id(fan1_safety_floor);  // Safety floor from hardware package
            if (effective > 0.0f && effective < floor1) effective = floor1;
            if (effective == 0.0) {
              id(fan1).turn_off().perform();
            } else {
              auto call = id(fan1).turn_on();
              call.set_speed(effective);
              call.perform();
            }
          }
        }
        if (id(auto_control_fan2).state) {
          if (!id(usr_override_fan2)) {
            float effective = write_val;
            float floor2 = id(fan2_safety_floor);  // Safety floor from hardware package
            if (effective > 0.0f && effective < floor2) effective = floor2;
            if (effective == 0.0) {
              id(fan2).turn_off().perform();
            } else {
              auto call = id(fan2).turn_on();
              call.set_speed(effective);
              call.perform();
            }
          }
        }
        if (id(auto_control_fan3).state) {
          if (!id(usr_override_fan3)) {
            float effective = write_val;
            float floor3 = id(fan3_safety_floor);  // Safety floor from hardware package
            if (effective > 0.0f && effective < floor3) effective = floor3;
            if (effective == 0.0) {
              id(fan3).turn_off().perform();
            } else {
              auto call = id(fan3).turn_on();
              call.set_speed(effective);
              call.perform();
            }
          }
        }
        if (id(auto_control_fan4).state) {
          if (!id(usr_override_fan4)) {
            float effective = write_val;
            float floor4 = id(fan4_safety_floor);  // Safety floor from hardware package
            if (effective > 0.0f && effective < floor4) effective = floor4;
            if (effective == 0.0) {
              id(fan4).turn_off().perform();
            } else {
              auto call = id(fan4).turn_on();
              call.set_speed(effective);
              call.perform();
            }
          }
        }

binary_sensor:
  - platform: template
    name: "Curve Configuration Warning"
    id: curve_config_warning_sensor
    entity_category: diagnostic
    icon: mdi:alert-circle
    # Boot-time complaint about the configured defaults, or a live axis fault.
    lambda: 'return id(curve_config_warning) || id(curve_axis_fault);'
