    name: "Curve Selection"
    id: curve_select
    icon: mdi:tune-variant
    entity_category: config
    options:
      - "${curve_a_name}"
      - "${curve_b_name}"
      - "${curve_c_name}"
    initial_option: "${curve_a_name}"
    optimistic: true
    restore_value: true

switch:
  - platform: template
    name: "Auto Control Fan 1"
    id: auto_control_fan1
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Auto Control Fan 2"
    id: auto_control_fan2
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
