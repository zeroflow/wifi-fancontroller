# Temperature Curve Triple Independent Control Module
#
# Three fully independent temperature-to-speed profiles, selectable from Home
# Assistant via a select entity. Each profile carries its own five temperature
# points, its own five speeds, and its own source sensor. Nothing is shared
# between the profiles except the fans they drive.
#
# This is the sibling of modules/temperature_curve_triple.yaml, which shares one
# temperature axis across all three profiles. Pick between them like this:
#
#   temperature_curve_triple             the breakpoints stay fixed and only the
#                                        aggressiveness changes. 27 entities.
#   temperature_curve_triple_independent the breakpoints differ per profile, or
#                                        the profiles read different sensors, or
#                                        one profile has to run inverted.
#                                        37 entities.
#
# Independent axes are what make an inverted profile possible. A profile whose
# speeds fall as temperature rises works in either module, but a cooling profile
# usually also needs its own temperature band, which only this module provides.
#
# This module is sensor-agnostic in the sense that it does not decide which
# profile is active. Profile selection is a plain select entity; put any
# automation logic in Home Assistant.
#
# Usage:
#   packages:
#     temperature_curve_triple_independent:
#       url: https://github.com/zeroflow/wifi-fancontroller
#       ref: main
#       files:
#         - path: modules/temperature_curve_triple_independent.yaml
#           vars:
#             friendly_name: "My Fan Controller"
#             curve_a_name: "Heating"
#             curve_b_name: "Ventilation"
#             curve_c_name: "Cooling"
#             curve_a_sensor_id: "hp_flow_temperature"
#             curve_a_temp1: "25.0"
#             curve_a_speed1: "0.0"
#             # ... etc
# Local use (no github:// required): see /reference/standalone/
#
# Configuration Variables:
#   - friendly_name: Device name prefix (default: "Fancontroller")
#   - curve_a_name / curve_b_name / curve_c_name: Profile display names
#   - curve_a_temp[1-5]: Temperature axis for profile A, must be ascending
#   - curve_b_temp[1-5]: Temperature axis for profile B, must be ascending
#   - curve_c_temp[1-5]: Temperature axis for profile C, must be ascending
#   - curve_a_speed[1-5]: Speeds for profile A
#   - curve_b_speed[1-5]: Speeds for profile B
#   - curve_c_speed[1-5]: Speeds for profile C
#   - curve_a_sensor_id / curve_b_sensor_id / curve_c_sensor_id: ESPHome id of
#     the sensor each profile reads (default: fancontroller_temperature for all
#     three, which is the onboard HDC1080)
#
# Features:
#   - Three independent 5-point profiles, each with its own temperature axis
#   - Per-profile source sensor, so one profile can follow a heat pump flow
#     temperature while another follows ambient air
#   - Linear interpolation between points; no runtime sorting
#   - Selection dispatches on the select index, so renaming a profile in the
#     substitutions cannot break which curve is active
#   - Individual auto-control switches for each of 4 fans
#   - Output value sensor showing the active profile's calculated fan speed
#
# Migrating from temperature_curve_triple:
#   The five shared axis_temp[1-5] substitutions are replaced by three separate
#   axes. To keep the behaviour you had, copy each axis_tempN value into all
#   three of curve_a_tempN, curve_b_tempN and curve_c_tempN. The speed
#   substitutions, the profile names, the select entity, the per-fan Auto
#   Control switches and the output sensor all keep their existing names and
#   semantics, so nothing else in your config has to change.
#
#   The number entities do change. The shared module exposes one Temp 1 to
#   Temp 5 block plus speeds named "<profile> 1" to "<profile> 5". Here every
#   number is profile-scoped and qualified, so you get "<profile> Temp 1" to
#   "<profile> Temp 5" and "<profile> Speed 1" to "<profile> Speed 5". Home
#   Assistant derives entity_id from the entity name, so the old entities will
#   not carry over and any dashboard card, automation or history referencing
#   them has to be repointed once.
#
#   The same applies to renaming a profile at any later date. Component IDs are
#   fixed literals and are never derived from the name substitutions, so a
#   rename leaves every lambda intact, but it does rename that profile's ten
#   Home Assistant entities and will break existing dashboard references and
#   history. Choose profile names at commissioning time.
#
# Source sensors:
#   Each profile names the sensor it reads. Leaving all three at the default
#   gives single-sensor behaviour: every profile follows the onboard HDC1080.
#   Point one at any other sensor::Sensor in your config, including a
#   platform: homeassistant sensor imported from Home Assistant.
#
#   The whole module is evaluated on a fixed 10 s interval rather than from the
#   source sensor's on_value trigger. With three possible sources, an on_value
#   trigger would only ever fire for one of them, so the interval is what keeps
#   every profile responsive.
#
#   CAVEAT: a curve_*_sensor_id naming an id that does not exist fails at
#   compile time, not at config validation, and the error is confusing. It
#   surfaces as a C++ error inside the generated lambda along the lines of
#   "'my_sensor' was not declared in this scope", pointing at a line of
#   generated code rather than at your YAML. If you see that, check the spelling
#   of your sensor ids first. The id must be the ESPHome id: of a sensor, not a
#   Home Assistant entity_id.
#
# Unavailable source sensor:
#   A sensor can report NAN, most commonly a platform: homeassistant sensor
#   whose Home Assistant entity is unavailable or has not arrived yet. When the
#   active profile's sensor reads NAN the module holds the last valid reading
#   for 60 seconds and keeps controlling from it. What happens next is set by
#   curve_failsafe_mode: in the default "speed" mode the module commands
#   curve_failsafe_speed (default "100.0", reproducing the original behaviour)
#   until the sensor returns. In "hold" mode the 60 second window never
#   expires and control simply continues from the last good reading
#   indefinitely. Entry into the hold, the fault condition persisting past the
#   window, and recovery are each logged at WARN.
#
#   Switching profiles discards the held value. Holding one profile's flow
#   temperature and feeding it into another profile's ambient curve would
#   produce a plausible looking but wrong speed.
#
# Configuration validation, two severity levels:
#   - A temperature axis that is not strictly ascending is a fault. It logs a
#     warning naming the offending profile and raises the configuration warning
#     sensor, whichever profile it belongs to. It triggers the failsafe
#     (curve_failsafe_speed in "speed" mode, or the last commanded speed in
#     "hold" mode) only while that profile is the ACTIVE one. A misconfigured
#     profile you are not currently using must not run your fans flat out, but
#     the one actually in control must fail loud, because interpolating over
#     an unordered axis produces meaningless speeds.
#   - Speeds that do not rise monotonically with temperature are informational
#     only. An inverted cooling profile and a deliberate quiet band are both
#     legitimate, so this raises the warning sensor but never triggers the
#     failsafe.
#
# Configurable failsafe:
#   curve_failsafe_speed (default "100.0") and curve_failsafe_mode (default
#   "speed", or "hold") control what both failsafe sites above actually do.
#   The defaults reproduce the original behaviour exactly: force every fan to
#   100% the moment either fault is active. Setting curve_failsafe_speed
#   changes the commanded percentage in "speed" mode. Setting
#   curve_failsafe_mode to "hold" keeps the module riding the last good
#   reading on the sensor path and the last commanded speed on the axis path,
#   falling back to curve_failsafe_speed only when there is nothing yet to
#   hold, such as right after boot or right after a profile switch.
#
# Safety floor integration:
#   Respects fan{1-4}_safety_floor globals from the hardware package. When a
#   safety module (for example stall_guard) sets a floor, this module will not
#   command a running fan below that floor value. Commanding a fan OFF (0%) is
#   always honored; the floor only applies to non-zero speeds.
#
# NOTE: This is a temperature control module. Do not use it together with
#   temperature_pid, temperature_linear, temperature_curve,
#   temperature_curve_dual, or temperature_curve_triple. They overlap on the
#   auto_control_fan* IDs and would fight over the fan outputs.
#
substitutions:
  friendly_name: "Fancontroller"
  curve_a_name: "Normal"
  curve_b_name: "Heating"
  curve_c_name: "Turbo"
  # Source sensor per profile. All three default to the onboard HDC1080, which
  # is single-sensor behaviour. These are ESPHome ids, not Home Assistant
  # entity_ids, and a typo fails at compile time rather than at config
  # validation. See the header.
  curve_a_sensor_id: "fancontroller_temperature"
  curve_b_sensor_id: "fancontroller_temperature"
  curve_c_sensor_id: "fancontroller_temperature"
  # Profile A temperature axis, ascending
  curve_a_temp1: "20.0"
  curve_a_temp2: "25.0"
  curve_a_temp3: "30.0"
  curve_a_temp4: "35.0"
  curve_a_temp5: "40.0"
  # Profile A speeds - balanced everyday profile
  curve_a_speed1: "0.0"
  curve_a_speed2: "30.0"
  curve_a_speed3: "55.0"
  curve_a_speed4: "80.0"
  curve_a_speed5: "100.0"
  # Profile B temperature axis, ascending
  curve_b_temp1: "20.0"
  curve_b_temp2: "25.0"
  curve_b_temp3: "30.0"
  curve_b_temp4: "35.0"
  curve_b_temp5: "40.0"
  # Profile B speeds - stays quiet longer, spins up later
  curve_b_speed1: "0.0"
  curve_b_speed2: "10.0"
  curve_b_speed3: "30.0"
  curve_b_speed4: "60.0"
  curve_b_speed5: "90.0"
  # Profile C temperature axis, ascending
  curve_c_temp1: "20.0"
  curve_c_temp2: "25.0"
  curve_c_temp3: "30.0"
  curve_c_temp4: "35.0"
  curve_c_temp5: "40.0"
  # Profile C speeds - maximum airflow, ramps early
  curve_c_speed1: "40.0"
  curve_c_speed2: "60.0"
  curve_c_speed3: "80.0"
  curve_c_speed4: "95.0"
  curve_c_speed5: "100.0"
  # Configurable failsafe. These defaults reproduce the original hard-wired
  # behaviour: force every fan to 100% the moment either failsafe site
  # triggers. curve_failsafe_speed is a percentage. curve_failsafe_mode
  # "hold" means the module keeps commanding what it was last commanding
  # instead of jumping to a fixed speed, falling back to curve_failsafe_speed
  # when there is nothing yet to hold.
  curve_failsafe_speed: "100.0"
  curve_failsafe_mode: "speed"

# Configuration validation flags.
#   curve_config_warning: a profile's speeds dip as temperature rises.
#                         Informational, checked once at boot.
#   curve_axis_warning:   at least one profile's live axis is not ascending
#                         right now, active or not. Feeds the warning sensor.
#   curve_axis_fault:     the ACTIVE profile's live axis is not ascending right
#                         now. This is the one that gates the failsafe.
#   curve_a_axis_bad /    per-profile edge trackers, so a persistent
#   curve_b_axis_bad /    misconfiguration is logged once when it appears and
#   curve_c_axis_bad      once when it clears, not every 10 seconds.
#
# The axes are deliberately NOT checked at boot, only live. The axis numbers
# are restore_value: true and editable from Home Assistant, so the substitution
# defaults stop being the values in use after the first boot. A boot check
# would be both redundant and misleading. See the axis scan in the
# curve_output_value lambda.
#
# Source sensor availability tracking:
#   curve_last_temp / curve_last_temp_valid: the most recent good reading, used
#                         to ride out a briefly unavailable sensor. The
#                         separate valid flag avoids relying on a NAN literal
#                         surviving into a global initializer.
#   curve_temp_stale_since: millis() when the sensor first went NAN, 0 when it
#                         is healthy. The hold window is measured from here.
#   curve_temp_hold_fault: the sensor has been unavailable long enough that the
#                         failsafe is active (speed mode) or would be if hold
#                         had nothing to ride on (hold mode). Edge flag, so the
#                         WARN is logged once rather than every 10 seconds.
#   curve_last_profile:   the profile index the held reading came from, -1
#                         before the first evaluation. A profile switch may
#                         change the source sensor, which invalidates the hold.
#   curve_last_output:    the last speed the curve itself produced. Written
#                         only on the curve-derived return path, never by a
#                         failsafe return, so hold mode never latches onto a
#                         failsafe value.
#   curve_last_output_valid: whether curve_last_output has ever been set.
#                         False right after boot and right after a profile
#                         switch, so hold mode falls back to
#                         curve_failsafe_speed while this is false.
globals:
  - id: curve_config_warning
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: curve_axis_warning
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: curve_axis_fault
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: curve_a_axis_bad
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: curve_b_axis_bad
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: curve_c_axis_bad
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: curve_last_temp
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: curve_last_temp_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: curve_temp_stale_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: curve_temp_hold_fault
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: curve_last_profile
    type: int
    restore_value: no
    initial_value: '-1'
  - id: curve_last_output
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: curve_last_output_valid
    type: bool
    restore_value: no
    initial_value: 'false'

# Check all three profiles' speeds at boot.
#
# The temperature axes are deliberately NOT checked here. They are checked on
# every evaluation instead, against the live number states. A boot check would
# only ever see the substitution defaults, which after the first boot are not
# necessarily the values in use. See the axis scan in the curve_output_value
# lambda.
esphome:
  on_boot:
    - priority: -100  # Run late, after numbers are initialized
      then:
        - lambda: |-
            // Informational only: speeds that dip as temperature rises. An
            // inverted cooling profile is built exactly this way, and so is a
            // deliberate quiet band, so this never triggers the failsafe.
            // Unlike an axis, a dipping profile is a hint about intent rather
            // than a correctness problem, so checking the configured defaults
            // once at boot is enough.
            float a[5] = {${curve_a_speed1}, ${curve_a_speed2}, ${curve_a_speed3}, ${curve_a_speed4}, ${curve_a_speed5}};
            float b[5] = {${curve_b_speed1}, ${curve_b_speed2}, ${curve_b_speed3}, ${curve_b_speed4}, ${curve_b_speed5}};
            float c[5] = {${curve_c_speed1}, ${curve_c_speed2}, ${curve_c_speed3}, ${curve_c_speed4}, ${curve_c_speed5}};
            const char* names[3] = {"${curve_a_name}", "${curve_b_name}", "${curve_c_name}"};
            float* profiles[3] = {a, b, c};
            bool speeds_ok = true;
            for (int p = 0; p < 3; p++) {
              for (int i = 0; i < 4; i++) {
                if (profiles[p][i] > profiles[p][i+1]) {
                  ESP_LOGI("temperature_curve_triple_independent",
                    "NOTE: Profile %s speed %d (%.1f%%) > speed %d (%.1f%%). "
                    "Fan speed decreases as temperature rises. This is allowed "
                    "and the profile stays active; ignore if intentional.",
                    names[p], i+1, profiles[p][i], i+2, profiles[p][i+1]);
                  id(curve_config_warning) = true;
                  speeds_ok = false;
                }
              }
            }

            if (speeds_ok) {
              ESP_LOGI("temperature_curve_triple_independent", "All three profiles validated OK");
            }

            // Configurable failsafe: validate the two substitutions once at
            // boot. Log only, never clamp, because a silent value change is
            // worse than a visible complaint.
            std::string failsafe_mode_str = "${curve_failsafe_mode}";
            if (failsafe_mode_str != "speed" && failsafe_mode_str != "hold") {
              ESP_LOGW("temperature_curve_triple_independent",
                "curve_failsafe_mode value \"%s\" is not recognised. Treating "
                "it as \"speed\".",
                failsafe_mode_str.c_str());
            }
            float boot_failsafe_speed_pct = ${curve_failsafe_speed};
            if (boot_failsafe_speed_pct < 0.0 || boot_failsafe_speed_pct > 100.0) {
              ESP_LOGW("temperature_curve_triple_independent",
                "curve_failsafe_speed (%.1f) is outside the 0 to 100 percent "
                "range.",
                boot_failsafe_speed_pct);
            }

