sensor:
  - platform: template
    name: $friendly_name Curve Output
    id: curve_output_value
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      // Configurable failsafe locals. The float local is load bearing, not
      // cosmetic: the substitution value is bare text, so a user writing
      // "40" would otherwise be an int handed to a %f conversion in the log
      // calls below, which is undefined behaviour. Every log argument and
      // every failsafe return uses failsafe_speed_pct, never the
      // substitution directly.
      const float failsafe_speed_pct = ${curve_failsafe_speed};
      const bool failsafe_hold = (std::string("${curve_failsafe_mode}") == "hold");

      // Dispatch on the select index rather than the option string, so that
      // renaming a profile cannot break selection. An empty optional (no
      // option active yet) falls back to profile A.
      //
      // This runs first because both the temperature axis and the source
      // sensor are chosen per profile, so the active profile has to be known
      // before anything can be read.
      int profile = 0;
      auto active = id(curve_select).active_index();
      if (active.has_value()) {
        profile = active.value();
      }

      const char* profile_names[3] = {"${curve_a_name}", "${curve_b_name}", "${curve_c_name}"};

      // A profile switch may switch the source sensor with it, so any value
      // held from the previous profile is discarded. Feeding one profile's
      // flow temperature into another profile's ambient curve would look
      // plausible and be wrong.
      if (profile != id(curve_last_profile)) {
        id(curve_last_profile) = profile;
        id(curve_last_temp_valid) = false;
        id(curve_temp_stale_since) = 0;
      }

      float temps[3][5] = {
        {
          id(curve_a_temp1).state,
          id(curve_a_temp2).state,
          id(curve_a_temp3).state,
          id(curve_a_temp4).state,
          id(curve_a_temp5).state
        },
        {
          id(curve_b_temp1).state,
          id(curve_b_temp2).state,
          id(curve_b_temp3).state,
          id(curve_b_temp4).state,
          id(curve_b_temp5).state
        },
        {
          id(curve_c_temp1).state,
          id(curve_c_temp2).state,
          id(curve_c_temp3).state,
          id(curve_c_temp4).state,
          id(curve_c_temp5).state
        }
      };

      // The one and only axis check. Runs every cycle against the live number
      // states, because these are editable from Home Assistant. Since this
      // module never sorts, a non-ascending axis makes interpolation
      // meaningless.
      //
      // All three axes are scanned, not just the active one, so the warning
      // sensor tells you about a profile you have misconfigured but not yet
      // selected. Only the ACTIVE profile's axis triggers the failsafe,
      // further down: a broken profile sitting idle must not disturb your
      // fans, but the profile actually in control must fail loud.
      bool prev_bad[3] = {
        id(curve_a_axis_bad),
        id(curve_b_axis_bad),
        id(curve_c_axis_bad)
      };
      bool axis_bad[3] = {false, false, false};
      for (int p = 0; p < 3; p++) {
        for (int i = 0; i < 4; i++) {
          if (temps[p][i] >= temps[p][i+1]) {
            axis_bad[p] = true;
          }
        }
        // Edge triggered, so a persistent misconfiguration is logged once when
        // it appears and once when it clears, not every 10 seconds.
        if (axis_bad[p] && !prev_bad[p]) {
          if (failsafe_hold) {
            ESP_LOGW("temperature_curve_triple_independent",
              "FAULT: profile %s temperature axis is not strictly ascending "
              "(%.1f, %.1f, %.1f, %.1f, %.1f). Its interpolation is "
              "meaningless. The last commanded speed is held whenever this "
              "profile is the active one.",
              profile_names[p], temps[p][0], temps[p][1], temps[p][2],
              temps[p][3], temps[p][4]);
          } else {
            ESP_LOGW("temperature_curve_triple_independent",
              "FAULT: profile %s temperature axis is not strictly ascending "
              "(%.1f, %.1f, %.1f, %.1f, %.1f). Its interpolation is "
              "meaningless. The fans run at %.1f%% whenever this profile is "
              "the active one.",
              profile_names[p], temps[p][0], temps[p][1], temps[p][2],
              temps[p][3], temps[p][4], failsafe_speed_pct);
          }
        }
        if (!axis_bad[p] && prev_bad[p]) {
          ESP_LOGI("temperature_curve_triple_independent",
            "Profile %s temperature axis is ascending again", profile_names[p]);
        }
      }
      id(curve_a_axis_bad) = axis_bad[0];
      id(curve_b_axis_bad) = axis_bad[1];
      id(curve_c_axis_bad) = axis_bad[2];
      id(curve_axis_warning) = axis_bad[0] || axis_bad[1] || axis_bad[2];

      // Separate edge log for the failsafe itself, because "profile B is
      // misconfigured" and "the fans are in the failsafe right now" are
      // different events and can happen minutes apart.
      if (axis_bad[profile] && !id(curve_axis_fault)) {
        if (failsafe_hold && id(curve_last_output_valid)) {
          ESP_LOGW("temperature_curve_triple_independent",
            "Active profile %s has an unordered axis. Failsafe mode is hold, "
            "so the last commanded speed (%.1f%%) is held until the points "
            "are corrected.", profile_names[profile], id(curve_last_output));
        } else if (failsafe_hold) {
          ESP_LOGW("temperature_curve_triple_independent",
            "Active profile %s has an unordered axis. Failsafe mode is hold "
            "but no speed has been commanded yet, so the fans run at %.1f%% "
            "until the points are corrected.", profile_names[profile],
            failsafe_speed_pct);
        } else {
          ESP_LOGW("temperature_curve_triple_independent",
            "Active profile %s has an unordered axis, running fans at %.1f%% "
            "until the points are corrected.", profile_names[profile],
            failsafe_speed_pct);
        }
      }
      if (!axis_bad[profile] && id(curve_axis_fault)) {
        ESP_LOGI("temperature_curve_triple_independent",
          "Active profile %s axis is usable again, resuming normal control",
          profile_names[profile]);
      }
      id(curve_axis_fault) = axis_bad[profile];

      float temp;
      if (profile == 1) {
        temp = id(${curve_b_sensor_id}).state;
      } else if (profile == 2) {
        temp = id(${curve_c_sensor_id}).state;
      } else {
        temp = id(${curve_a_sensor_id}).state;
      }

      // Unavailable source sensor. A platform: homeassistant sensor reads NAN
      // whenever its Home Assistant entity is unavailable, restarting, or has
      // simply not sent its first state yet, so a brief NAN is normal and must
      // not disturb the fans. Ride it out on the last good reading for 60 s,
      // then fail loud into the configured failsafe rather than drifting on
      // stale data forever. In "hold" mode the ride-out has no expiry, which
      // is the whole point of that mode.
      const uint32_t hold_window_ms = 60000;
      if (isnan(temp)) {
        uint32_t now = millis();
        if (id(curve_temp_stale_since) == 0) {
          id(curve_temp_stale_since) = now;
          if (failsafe_hold) {
            ESP_LOGW("temperature_curve_triple_independent",
              "Source sensor for profile %s is unavailable. Failsafe mode is "
              "hold, so control continues from the last good reading until "
              "it returns.",
              profile_names[profile]);
          } else {
            ESP_LOGW("temperature_curve_triple_independent",
              "Source sensor for profile %s is unavailable. Holding the last "
              "reading for up to %u s.",
              profile_names[profile], hold_window_ms / 1000);
          }
        }
        bool within_window = (now - id(curve_temp_stale_since)) < hold_window_ms;
        if (id(curve_last_temp_valid) && (within_window || failsafe_hold)) {
          temp = id(curve_last_temp);
          if (failsafe_hold && !within_window && !id(curve_temp_hold_fault)) {
            ESP_LOGW("temperature_curve_triple_independent",
              "FAULT: source sensor for profile %s still unavailable after "
              "%u s. Failsafe mode is hold, so control continues from the "
              "last good reading (%.1f C) until it returns.",
              profile_names[profile], hold_window_ms / 1000, id(curve_last_temp));
            id(curve_temp_hold_fault) = true;
          }
        } else {
          if (!id(curve_temp_hold_fault)) {
            if (failsafe_hold) {
              ESP_LOGW("temperature_curve_triple_independent",
                "FAULT: source sensor for profile %s still unavailable after "
                "%u s and there is no held reading to fall back on. Running "
                "fans at %.1f%% until it returns.",
                profile_names[profile], hold_window_ms / 1000, failsafe_speed_pct);
            } else {
              ESP_LOGW("temperature_curve_triple_independent",
                "FAULT: source sensor for profile %s still unavailable after "
                "%u s. Running fans at %.1f%% until it returns.",
                profile_names[profile], hold_window_ms / 1000, failsafe_speed_pct);
            }
            id(curve_temp_hold_fault) = true;
          }
          return failsafe_speed_pct;
        }
      } else {
        if (id(curve_temp_stale_since) != 0) {
          ESP_LOGW("temperature_curve_triple_independent",
            "Source sensor for profile %s is available again (%.1f), "
            "resuming normal control.",
            profile_names[profile], temp);
        }
        id(curve_temp_stale_since) = 0;
        id(curve_temp_hold_fault) = false;
        id(curve_last_temp) = temp;
        id(curve_last_temp_valid) = true;
      }

      // The failsafe. Deliberately gated on the ACTIVE profile only. The
      // action taken (curve_failsafe_speed, or the held last output) is
      // whatever curve_failsafe_mode selects.
      if (id(curve_axis_fault)) {
        if (failsafe_hold && id(curve_last_output_valid)) {
          return id(curve_last_output);
        }
        return failsafe_speed_pct;
      }

      float axis[5];
      float speeds[5];
      if (profile == 1) {
        speeds[0] = id(curve_b_speed1).state;
        speeds[1] = id(curve_b_speed2).state;
        speeds[2] = id(curve_b_speed3).state;
        speeds[3] = id(curve_b_speed4).state;
        speeds[4] = id(curve_b_speed5).state;
      } else if (profile == 2) {
        speeds[0] = id(curve_c_speed1).state;
        speeds[1] = id(curve_c_speed2).state;
        speeds[2] = id(curve_c_speed3).state;
        speeds[3] = id(curve_c_speed4).state;
        speeds[4] = id(curve_c_speed5).state;
      } else {
        speeds[0] = id(curve_a_speed1).state;
        speeds[1] = id(curve_a_speed2).state;
        speeds[2] = id(curve_a_speed3).state;
        speeds[3] = id(curve_a_speed4).state;
        speeds[4] = id(curve_a_speed5).state;
      }
      for (int i = 0; i < 5; i++) {
        axis[i] = temps[profile][i];
      }

      // Points are never sorted. They must be entered in ascending order;
      // the live axis scan above catches it when they are not.

      float result = 0.0;
      if (temp <= axis[0]) {
        // Below first point: use first speed
        result = speeds[0];
      } else if (temp >= axis[4]) {
        // Above last point: use last speed
        result = speeds[4];
      } else {
        // Interpolate between the two surrounding points
        for (int i = 0; i < 4; i++) {
          if (temp >= axis[i] && temp <= axis[i+1]) {
            float temp_range = axis[i+1] - axis[i];
            if (temp_range <= 0.0001) {
              result = speeds[i];
            } else {
              float ratio = (temp - axis[i]) / temp_range;
              result = speeds[i] + ratio * (speeds[i+1] - speeds[i]);
            }
            break;
          }
        }
      }

      // This is the only place curve_last_output is ever written. The
      // on_value trigger below also fires for failsafe values, so recording
      // the output there would poison the held value used by hold mode.
      id(curve_last_output) = result;
      id(curve_last_output_valid) = true;
      return result;
    on_value:
      then:
        - output.set_level:
            id: curve_proxy_output
            level: !lambda 'return x / 100.0;'

# NOTE: The write_action lambda below is a verbatim copy of the one in
# modules/temperature_curve.yaml (per-fan auto_control + usr_override +
# safety_floor gating). ESPHome YAML cannot share lambda blocks across
# modules, so every temperature module duplicates it. Keep temperature_curve,
# temperature_linear, temperature_curve_dual, temperature_curve_triple and
# temperature_curve_triple_independent in sync. temperature_pid deliberately
# differs and is not part of this set.
output:
  - platform: template
    id: curve_proxy_output
    type: float
    write_action:
      lambda: |-
        float write_val = state*100.0;

        if (id(auto_control_fan1).state) {
          if (!id(usr_override_fan1)) {
            float effective = write_val;
            float floor1 = id(fan1_safety_floor);  // Safety floor from hardware package
            if (effective > 0.0f && effective < floor1) effective = floor1;
            if (effective == 0.0) {
              id(fan1).turn_off().perform();
            } else {
              auto call = id(fan1).turn_on();
              call.set_speed(effective);
              call.perform();
            }
          }
        }
        if (id(auto_control_fan2).state) {
          if (!id(usr_override_fan2)) {
            float effective = write_val;
            float floor2 = id(fan2_safety_floor);  // Safety floor from hardware package
            if (effective > 0.0f && effective < floor2) effective = floor2;
            if (effective == 0.0) {
              id(fan2).turn_off().perform();
            } else {
              auto call = id(fan2).turn_on();
              call.set_speed(effective);
              call.perform();
            }
          }
        }
        if (id(auto_control_fan3).state) {
          if (!id(usr_override_fan3)) {
            float effective = write_val;
            float floor3 = id(fan3_safety_floor);  // Safety floor from hardware package
            if (effective > 0.0f && effective < floor3) effective = floor3;
            if (effective == 0.0) {
              id(fan3).turn_off().perform();
            } else {
              auto call = id(fan3).turn_on();
              call.set_speed(effective);
              call.perform();
            }
          }
        }
        if (id(auto_control_fan4).state) {
          if (!id(usr_override_fan4)) {
            float effective = write_val;
            float floor4 = id(fan4_safety_floor);  // Safety floor from hardware package
            if (effective > 0.0f && effective < floor4) effective = floor4;
            if (effective == 0.0) {
              id(fan4).turn_off().perform();
            } else {
              auto call = id(fan4).turn_on();
              call.set_speed(effective);
              call.perform();
            }
          }
        }

binary_sensor:
  - platform: template
    name: "Curve Configuration Warning"
    id: curve_config_warning_sensor
    entity_category: diagnostic
    icon: mdi:alert-circle
    # Boot-time complaint about the configured speeds, or a live unordered axis
    # on ANY profile, active or not.
    lambda: 'return id(curve_config_warning) || id(curve_axis_warning);'
