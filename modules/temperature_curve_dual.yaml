  - platform: template
    name: "Curve Selection"
    id: curve_select
    icon: mdi:swap-horizontal
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF # off = Curve A (aggressive)

  - platform: template
    name: "Auto Control Fan 1"
    id: auto_control_fan1
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Auto Control Fan 2"
    id: auto_control_fan2
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Auto Control Fan 3"
    id: auto_control_fan3
    entity_category: config
