# Temperature Curve Dual Control Module
#
# Two complete 5-point temperature curves (A and B) selectable via a single
# Home Assistant switch. Designed for an "aggressive vs defensive" setup where
# an external automation (for example an air-quality sensor) flips the switch:
# bad air quality selects the defensive curve that spins up later.
#
# This module is sensor-agnostic. It does not read any air-quality sensor
# itself. Curve selection is a plain switch; put any automation logic in
# Home Assistant.
#
# Usage:
#   packages:
#     temperature_curve_dual:
#       url: https://github.com/zeroflow/wifi-fancontroller
#       ref: main
#       files:
#         - path: modules/temperature_curve_dual.yaml
#           vars:
#             friendly_name: "My Fan Controller"
#             # Curve A (switch off, aggressive)
#             curveA_temp1: "20.0"
#             curveA_speed1: "0.0"
#             # ... etc
# Local use (no github:// required): see /reference/standalone/
#
# Configuration Variables:
#   - friendly_name: Device name prefix (default: "Fancontroller")
#   - curveA_temp[1-5] / curveA_speed[1-5]: Curve A points (switch off)
#   - curveB_temp[1-5] / curveB_speed[1-5]: Curve B points (switch on)
#   - temperature_sensor_id: Id of the sensor supplying the control temperature
#       (default: fancontroller_temperature, the onboard sensor).
#
# Features:
#   - Two independent 5-point curves, switchable from Home Assistant
#   - Linear interpolation between points; points auto-sorted at runtime
#   - Individual auto-control switches for each of 4 fans
#   - Output value sensor showing the active curve's calculated fan speed
#
# Safety floor integration:
#   Respects fan{1-4}_safety_floor globals from the hardware package. When a
#   safety module (for example stall_guard) sets a floor, this module will not
#   command a running fan below that floor value. Commanding a fan OFF (0%) is
#   always honored; the floor only applies to non-zero speeds.
#
# NOTE: This is a temperature control module. Do not use it together with
#   temperature_pid, temperature_linear, or temperature_curve. They overlap on
#   the auto_control_fan* IDs and would fight over the fan outputs.
#
substitutions:
  friendly_name: "Fancontroller"
  # Sensor supplying the control temperature. Defaults to the onboard sensor
  temperature_sensor_id: fancontroller_temperature
  # Curve A - aggressive (switch off)
  curveA_temp1: "20.0"
  curveA_speed1: "0.0"
  curveA_temp2: "22.0"
  curveA_speed2: "30.0"
  curveA_temp3: "28.0"
  curveA_speed3: "60.0"
  curveA_temp4: "35.0"
  curveA_speed4: "85.0"
  curveA_temp5: "40.0"
  curveA_speed5: "100.0"
  # Curve B - defensive (switch on, spins up later)
  curveB_temp1: "25.0"
  curveB_speed1: "0.0"
  curveB_temp2: "35.0"
  curveB_speed2: "25.0"
  curveB_temp3: "45.0"
  curveB_speed3: "50.0"
  curveB_temp4: "50.0"
  curveB_speed4: "65.0"
  curveB_temp5: "55.0"
  curveB_speed5: "80.0"

# Configuration validation flag
globals:
  - id: curve_config_warning
    type: bool
    restore_value: no
    initial_value: "false"

# Validate both curves at boot
esphome:
  on_boot:
    - priority: -100 # Run late, after numbers are initialized
      then:
        - lambda: |-
            ESP_LOGI("temperature_curve_dual", "Control sensor: ${temperature_sensor_id}");

            float a[5] = {${curveA_temp1}, ${curveA_temp2}, ${curveA_temp3}, ${curveA_temp4}, ${curveA_temp5}};
            float b[5] = {${curveB_temp1}, ${curveB_temp2}, ${curveB_temp3}, ${curveB_temp4}, ${curveB_temp5}};
            const char* names[2] = {"A", "B"};
            float* curves[2] = {a, b};
            bool all_ok = true;
            for (int c = 0; c < 2; c++) {
              for (int i = 0; i < 4; i++) {
                if (curves[c][i] >= curves[c][i+1]) {
                  ESP_LOGW("temperature_curve_dual",
                    "WARNING: Curve %s temperature point %d (%.1f) >= point %d (%.1f)! "
                    "Curve will be auto-sorted at runtime, but consider fixing your configuration.",
                    names[c], i+1, curves[c][i], i+2, curves[c][i+1]);
                  id(curve_config_warning) = true;
                  all_ok = false;
                }
              }
            }
            if (all_ok) {
              ESP_LOGI("temperature_curve_dual", "Both temperature curves validated OK");
            }

