# Vale configuration for the docs prose lint.
# This file is partly generated: everything between the BEGIN and END marker
# lines is written by 'bash site/scripts/verify-prose.sh --write-config' from
# site/style-guide/page-tiers.yml and site/style-guide/blocking.yml. Edit the
# globals above the markers by hand and never touch the generated block.
# How the lint works and how to run it: site/style-guide/README.md
StylesPath = .vale/styles
MinAlertLevel = suggestion
# Starlight puts an sr-only label inside every heading anchor ("Section titled ...").
IgnoredClasses = sr-only
SkippedScopes = script, style, pre, noscript, iframe, svg

# Vale accepts the token ignore list only inside a section, so it sits here and
# not among the globals above. The section matches every built page. It holds
# no style of its own. The ignored text is: the two brand names and the approved
# German pair form of the operator role (glossary rows G-01 and G-13), so term
# and role words do not fire inside them, and host names such as
# improv-wifi.com. The entries are comma separated regular expressions, so none
# of them may contain a comma. verify-prose.sh --glossary checks that the brand
# names and pair forms from the glossary are listed.
[*.{html,vhtml}]
TokenIgnores = (WiFi Fan Controller), (WiFi Lüftersteuerung), (Betreiberin oder Betreiber), (\b[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.(?:com|org|net|dev|io|de|eu|local)\b)

# Test only: vale test cases without a rule run through this file as real pages
# do. Their format is vhtml, which Vale reads as html, and the section below
# enables both own styles for it. No built page has this extension.
[formats]
vhtml = html

[*.vhtml]
BasedOnStyles = DocsEN, DocsDE

