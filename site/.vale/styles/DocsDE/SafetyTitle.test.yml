- name: yields exactly one alert for two asides with one correct
  rule: SafetyTitle.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--caution'><p class='starlight-aside__title'>VORSICHT: Geregeltes Netzteil verwenden</p><div class='starlight-aside__content'><p>Text.</p></div></aside><aside class='starlight-aside starlight-aside--caution'><p class='starlight-aside__title'>Geregeltes Netzteil verwenden</p><div class='starlight-aside__content'><p>Text.</p></div></aside></div></main>"
  want: "1:150:DocsDE.SafetyTitle:Beginnen Sie den Titel eines Caution- oder Danger-Hinweises mit VORSICHT:, WARNUNG: oder GEFAHR:. Siehe site/style-guide/safety.md."

- name: ignores a note aside with any title
  rule: SafetyTitle.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--note'><p class='starlight-aside__title'>Geregeltes Netzteil verwenden</p><div class='starlight-aside__content'><p>Text.</p></div></aside></div></main>"
  absent: "DocsDE.SafetyTitle"

