- name: flags a caution title without a signal word
  rule: SafetyTitle.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--caution'><p class='starlight-aside__title'>Geregeltes Netzteil verwenden</p><div class='starlight-aside__content'><p>Text.</p></div></aside></div></main>"
  contains: "VORSICHT:"

- name: flags a title that starts with an umlaut
  rule: SafetyTitle.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--caution'><p class='starlight-aside__title'>Überspannung vermeiden</p><div class='starlight-aside__content'><p>Text.</p></div></aside></div></main>"
  contains: "VORSICHT:"

- name: accepts a caution title with VORSICHT
  rule: SafetyTitle.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--caution'><p class='starlight-aside__title'>VORSICHT: Geregeltes Netzteil verwenden</p><div class='starlight-aside__content'><p>Text.</p></div></aside></div></main>"
  absent: "DocsDE.SafetyTitle"

- name: accepts a danger title with WARNUNG
  rule: SafetyTitle.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--danger'><p class='starlight-aside__title'>WARNUNG: Abstand zur Antenne</p><div class='starlight-aside__content'><p>Text.</p></div></aside></div></main>"
  absent: "DocsDE.SafetyTitle"

