  input: "<main lang='de'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--danger'><p class='starlight-aside__title'>GEFAHR: Netzspannung</p><div class='starlight-aside__content'><p>Text.</p></div></aside></div></main>"
