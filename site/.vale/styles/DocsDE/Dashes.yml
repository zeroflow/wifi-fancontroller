extends: existence
message: "Verwenden Sie keinen Gedankenstrich als Satzzeichen ('%s'). Schreiben Sie stattdessen ein Komma, einen Doppelpunkt, eine Klammer oder zwei Sätze."
level: warning
nonword: true
scope: 'text & content_de'
tokens:
  - '\x{2014}'
  - '\s\x{2013}'
  - '\x{2013}\s'
  - '\s-{1,3}\s'
  - '[^\s-]-{2,3}'
  - '-{2,3}(?:\s|$)'
