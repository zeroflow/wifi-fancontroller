# mirrors: Passive, Subjunctive, Vague, Pronouns
extends: existence
message: "Schritte und Sicherheitshinweise vermeiden '%s'. Schreiben Sie aktiv und genau. Siehe site/style-guide/de.md."
level: suggestion
ignorecase: false
nonword: true
scope: 'text & strict_elements_de'
tokens:
  - '(?i:wird|werden|wurde|wurden|worden)(?:\s+[\p{L}\p{N}*-]+){0,4}?\s+\b(?:an|auf|aus|ab|bei|ein|fest|her|hin|mit|nach|vor|weg|zu|zurück|um)?ge\p{L}{2,}(?:t|en)\b'
  - '(?i)\b(?:würde|würden|würdest|könnte|könnten|sollte|sollten|wäre|wären|hätte|hätten|müsste|müssten|dürfte|dürften)\b'
  - '(?i)\beventuell\b'
  - '(?i)\bvielleicht\b'
  - '(?i)\brelativ(?:e|en|er|es|em)?\b'
  - '(?i)\beinfach(?:e|en|er|es|em)?\b'
  - '(?i)\bschnell(?:e|en|er|es|em)?\b'
  - '(?i)\bziemlich\b'
  - '(?i)\beigentlich\b'
  - '(?i)\bnormalerweise\b'
  - '(?i)\bmöglicherweise\b'
  - '(?i)\bunter\s+Umständen\b'
  - '(?i)\bgegebenenfalls\b'
  - '(?i)\bquasi\b'
  - '\b[Mm]an\b'
