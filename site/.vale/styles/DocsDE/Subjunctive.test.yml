- name: accepts kann
  rule: Subjunctive.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><p>Der Lüfter kann laufen.</p></div></main>"
  absent: "DocsDE.Subjunctive"

- name: accepts soll
  rule: Subjunctive.yml
