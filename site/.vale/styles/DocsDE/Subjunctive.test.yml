- name: ignores the same text outside the content container
  rule: Subjunctive.yml
  format: html
  input: "<nav><p>Sie könnten das Netzteil prüfen.</p></nav><main lang='de'><div class='sl-markdown-content'><p>Fine text.</p></div></main>"
  absent: "DocsDE.Subjunctive"

- name: ignores the same text on an English fallback page
  rule: Subjunctive.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Sie könnten das Netzteil prüfen.</p></div></main>"
  absent: "DocsDE.Subjunctive"
