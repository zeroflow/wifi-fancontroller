- name: accepts compounds that are not role nouns
  rule: RoleNouns.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><p>Die Benutzeroberfläche und der Kundenservice sind bereit.</p></div></main>"
  absent: "DocsDE.RoleNouns"

- name: ignores a role noun in inline code
  rule: RoleNouns.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><p>Setzen Sie <code>Benutzer</code> auf true.</p></div></main>"
  absent: "DocsDE.RoleNouns"

- name: ignores the same text outside the content container
  rule: RoleNouns.yml
  format: html
  input: "<nav><p>Der Benutzer drückt die Taste.</p></nav><main lang='de'><div class='sl-markdown-content'><p>Guter Text.</p></div></main>"
  absent: "DocsDE.RoleNouns"

- name: ignores the same text on an English fallback page
  rule: RoleNouns.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Der Benutzer drückt die Taste.</p></div></main>"
  absent: "DocsDE.RoleNouns"
