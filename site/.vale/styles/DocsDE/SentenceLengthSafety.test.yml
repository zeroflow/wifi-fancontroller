- name: flags a 23 word sentence in a caution aside
  rule: SentenceLengthSafety.yml
  format: html
  input: "<main lang='de'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--caution'><p class='starlight-aside__title'>Titel</p><div class='starlight-aside__content'><p>Schließen Sie den Lüfter an die Platine an und prüfen Sie danach, ob die Leuchte dauerhaft grün leuchtet, nachdem Sie die Resettaste einmal.</p></div></aside></div></main>"
  contains: "höchstens 22 Wörter"

