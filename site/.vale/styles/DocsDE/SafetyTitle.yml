extends: script
message: "Beginnen Sie den Titel eines Caution- oder Danger-Hinweises mit VORSICHT:, WARNUNG: oder GEFAHR:. Siehe site/style-guide/safety.md."
level: warning
scope: safety_title_de
script: |
  text := import("text")
  matches := []
  title := text.trim_space(scope)
  if title != "" && !text.re_match("^(VORSICHT|WARNUNG|GEFAHR):", title) {
    start := text.index(scope, title)
    matches = append(matches, {begin: start, end: start + len(title)})
  }
