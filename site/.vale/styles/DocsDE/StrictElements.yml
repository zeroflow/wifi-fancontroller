# mirrors: Abbreviations, Semicolons, Exclamations
extends: existence
message: "Schritte und Sicherheitshinweise verlangen die strenge Schreibweise. Formulieren Sie '%s' um. Siehe site/style-guide/de.md."
level: warning
ignorecase: false
nonword: true
scope: 'text & strict_elements_de'
tokens:
  - '(?i)\bz\.[ \x{00A0}\x{202F}]?B\.'
  - '(?i)\bd\.[ \x{00A0}\x{202F}]?h\.'
  - '(?i)\bu\.[ \x{00A0}\x{202F}]?a\.'
  - '(?i)\bs\.[ \x{00A0}\x{202F}]?o\.'
  - '(?i)\bs\.[ \x{00A0}\x{202F}]?u\.'
  - '(?i)\busw\.'
  - '(?i)\bbzw\.'
  - '(?i)\bca\.'
  - '(?i)\bggf\.'
  - '(?i)\bevtl\.'
  - '(?i)\binkl\.'
  - '(?i)\bvgl\.'
  - '(?i)\bNr\.'
  - '(?i)\bAbb\.'
  - '(?i)\b(?:max|min)\.\s*\d'
  - ';'
  - '!(?:\s|$)'
