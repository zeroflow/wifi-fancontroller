- name: flags a 21 word sentence in a caution aside
  rule: SentenceLengthSafety.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><aside class='starlight-aside starlight-aside--caution'><p class='starlight-aside__title'>Title</p><div class='starlight-aside__content'><p>Connect the fan to the board and check that the light shows a steady green color after you press the reset.</p></div></aside></div></main>"
  contains: "Keep each sentence in a caution or danger notice"

