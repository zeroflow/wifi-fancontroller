- name: flags e.g.
  rule: Abbreviations.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Use a PWM fan, e.g. a four wire fan.</p></div></main>"
  contains: "Write out the abbreviation"

- name: flags i.e.
  rule: Abbreviations.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Use a PWM fan, i.e. a four wire fan.</p></div></main>"
  contains: "Write out the abbreviation"

