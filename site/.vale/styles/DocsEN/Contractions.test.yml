- name: accepts a possessive with a straight apostrophe
  rule: Contractions.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Check the board's header.</p></div></main>"
  absent: "DocsEN.Contractions"

- name: accepts a possessive with a typographic apostrophe
  rule: Contractions.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Check the board\u2019s header.</p></div></main>"
  absent: "DocsEN.Contractions"

- name: accepts the written out form
  rule: Contractions.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Do not connect the fan.</p></div></main>"
  absent: "DocsEN.Contractions"

- name: ignores the same text outside the content container
  rule: Contractions.yml
  format: html
  input: "<nav><p>Don't connect the fan.</p></nav><main lang='en'><div class='sl-markdown-content'><p>Fine text.</p></div></main>"
  absent: "DocsEN.Contractions"
