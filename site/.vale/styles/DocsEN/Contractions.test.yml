- name: flags a contraction with a straight apostrophe
  rule: Contractions.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Don't connect the fan.</p></div></main>"
  contains: "Write out the contraction"

- name: flags a contraction with a typographic apostrophe
  rule: Contractions.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Don\u2019t connect the fan.</p></div></main>"
  contains: "Write out the contraction"

- name: flags it is with a straight apostrophe
  rule: Contractions.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>It's a fan header.</p></div></main>"
