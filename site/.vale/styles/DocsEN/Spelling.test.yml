- name: flags colour and names the American form
  rule: Spelling.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>The colour of the LED changes.</p></div></main>"
  want: "1:57:DocsEN.Spelling:Use the American spelling 'color' instead of 'colour'."

