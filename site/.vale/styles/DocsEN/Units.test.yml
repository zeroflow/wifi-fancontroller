- name: flags 12V
  rule: Units.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>The board needs 12V.</p></div></main>"
  contains: "Write a space between the number and the unit"

- name: flags 3.3V
  rule: Units.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>The logic level is 3.3V.</p></div></main>"
  contains: "Write a space between the number and the unit"

