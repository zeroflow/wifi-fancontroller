- name: accepts 12 V with a space
  rule: Units.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>The board needs 12 V.</p></div></main>"
  absent: "DocsEN.Units"

- name: accepts 12 V with a non-breaking space
  rule: Units.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>The board needs 12\u00a0V.</p></div></main>"
  absent: "DocsEN.Units"

