- name: ignores the same text outside the content container
  rule: Units.yml
  format: html
  input: "<nav><p>The board needs 12V.</p></nav><main lang='en'><div class='sl-markdown-content'><p>Fine text.</p></div></main>"
  absent: "DocsEN.Units"
