- name: flags a 21 word sentence in a numbered step
  rule: SentenceLengthSteps.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><ol><li><p>Connect the fan to the board and check that the light shows a steady green color after you press the reset.</p></li></ol></div></main>"
  contains: "Keep each step sentence"

- name: accepts a 20 word sentence in a numbered step
  rule: SentenceLengthSteps.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><ol><li><p>Connect the fan to the board and check that the light shows a steady green color after you press the.</p></li></ol></div></main>"
  absent: "DocsEN.SentenceLengthSteps"

- name: ignores a 21 word sentence in a plain paragraph
  rule: SentenceLengthSteps.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>Connect the fan to the board and check that the light shows a steady green color after you press the reset.</p></div></main>"
  absent: "DocsEN.SentenceLengthSteps"

- name: ignores a 21 word sentence in a step outside the content container
  rule: SentenceLengthSteps.yml
  format: html
  input: "<nav><p>Connect the fan to the board and check that the light shows a steady green color after you press the reset.</p></nav><main lang='en'><div class='sl-markdown-content'><p>Fine text.</p></div></main>"
  absent: "DocsEN.SentenceLengthSteps"
