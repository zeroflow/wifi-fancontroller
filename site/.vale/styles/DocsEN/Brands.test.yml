- name: flags Wifi Fan Controller
  rule: Brands.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>The Wifi Fan Controller has four ports.</p></div></main>"
  contains: "'WiFi Fan Controller' instead of 'Wifi Fan Controller'"

- name: flags Wi-Fi Fan Controller
  rule: Brands.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>The Wi-Fi Fan Controller has four ports.</p></div></main>"
  contains: "'WiFi Fan Controller'"

- name: flags WIFI Fan Controller
  rule: Brands.yml
  format: html
  input: "<main lang='en'><div class='sl-markdown-content'><p>The WIFI Fan Controller has four ports.</p></div></main>"
  contains: "'WiFi Fan Controller'"

- name: flags WiFi Fancontroller
  rule: Brands.yml
  format: html
