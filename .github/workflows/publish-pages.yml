name: Publish Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/publish-pages.yml'
  workflow_run:
    workflows:
      - Publish Firmware
    types:
      - completed
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/publish-pages.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Create firmware directory
        run: mkdir -p site/public/firmware

      - name: Fetch firmware files
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          fileName: '*'
          out-file-path: site/public/firmware

      # The datasheet PDFs (publish-datasheet.yml) ship as release assets, so
      # they arrive in the same release-downloader sweep as the firmware
      # binaries. Move them into their own public path so they are served from
      # /datasheet/ rather than /firmware/. nullglob keeps this a no-op for
      # releases predating the datasheet workflow.
      - name: Relocate datasheet PDFs to /datasheet/
        run: |
          mkdir -p site/public/datasheet
          shopt -s nullglob
          for f in site/public/firmware/*datasheet*.pdf; do
            mv "$f" site/public/datasheet/
          done

      - name: Build Astro site
        uses: withastro/action@v6
        with:
          path: ./site

  publish:
    if: github.event_name != 'pull_request'
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
