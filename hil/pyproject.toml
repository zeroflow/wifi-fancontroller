[project]
name = "hil"
version = "0.1.0"
description = "Hardware-in-the-loop harness for the WiFi Fan Controller firmware"
requires-python = ">=3.12"
dependencies = [
    "aioesphomeapi==46.12.0",
    "esptool==5.4.0",
    # OTA client only (hil/ota.py runs esphome.espota2 in a worker subprocess); the same
    # ESPHome release the firmware is built with. See dependency-metadata below.
    "esphome==2026.10.1",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
]

[tool.uv]
package = false
# The runner and the dev host are Linux; restricting the lock keeps platform-only
# transitive packages (colorama, and similar) out of the reviewed set.
environments = ["sys_platform == 'linux'"]

# esphome declares about 50 runtime requirements (a source-only paho-mqtt among them) that
# the OTA client never imports. Declaring only what espota2 needs keeps the lock to one new
# hash-locked wheel on the LAN runner. If an esphome bump makes `import esphome.espota2`
# need another package, the import fails loudly and that package gets its own review.
[[tool.uv.dependency-metadata]]
name = "esphome"
version = "2026.10.1"
requires-dist = ["aioesphomeapi==46.12.0"]

[tool.pytest.ini_options]
markers = [
    "image(before=None, after=None): manifest role DUT A must run before and after the test (HARN-03)",
    "requires(*capabilities): rig.toml capabilities the test needs; missing ones skip with a reason (HARN-02)",
    "canary: the QC-06 canary detection test; a run in which no canary-marked test passed is never green (D-31)",
]
testpaths = ["tests"]
pythonpath = ["."]
# -rs: every skip and its reason appear in the run output, so a capability skip is visible (HARN-02).
addopts = "-p no:cacheprovider -rs"
# Deadlines nest: operation (flash 120 s, API 90 s, OTA 180 s, ...) < per-test 620 s < session
# 780 s < "Run hardware check" step (26 min = 1560 s) < job (60 min, the policy cap).
# The HARD ceilings are the per-test timeout below and the step-level timeout-minutes in
# hil.yml, which also cap Teardown (15 min, longer than its all-deadlines-hit worst case); the step budgets sum
# to 59 min so the job deadline can never fall inside Teardown. tests/unit/test_timeouts.py
# computes the sums and the run-step bound (connect + release + session + one overshooting test
# + release + API connect = 1540 s < 1560 s) from the code and fails if they drift.
# session_timeout is cooperative only: pytest-timeout checks it after a test has finished and
# cannot interrupt a running one, so a test started just before it may run its whole timeout.
# A run it ends is RIG ERROR ("run cut by the session deadline"), never PASS or FAIL
# (hil/__main__.py decide_verdict), and the run-step bound keeps the step ceiling from cutting first.
# Per-test worst cases (tests/unit/test_timeouts.py WORST_CASE_S, with the 100 s state-check allowance of
# 02-07 on every test that has an image marker): smoke 506 s, OTA 410 s, canary 605 s; 620 s covers each.
# Signal mode raises inside the test so fixture finalizers (switches off) still run.
timeout = 620
timeout_method = "signal"
session_timeout = 780

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Not the default set: it adds UP031 (185 findings against the project's deliberate
# "%" string formatting) and other style rules. This selection is the error-level
# subset: import and statement syntax problems (E4, E7, E9) and pyflakes (F), which
# catches unused imports and undefined names, the failures that matter for test code.
select = ["E4", "E7", "E9", "F"]
