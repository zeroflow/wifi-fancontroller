# WiFi Fan Controller - Revision 4.0 (ESP32-C6), A- and B-Sample
# Sample firmware, not a product firmware
#
# For the A- and B-sample boards (ESP32-C6-MINI-1-N4, 4MB flash). It imports
# hardware-rev-4.0a.yaml.
#
# Build it in the ESPHome dashboard: "New Device", skip the wizard, then
# replace the generated YAML with this file. Flash the first time over USB-C,
# afterwards over WiFi (OTA).
#
# There is no update entity and no HTTP OTA, because the production manifest
# ships C-sample images that do not fit these boards.

packages:
  # Include hardware-specific configuration
  hardware: github://zeroflow/wifi-fancontroller/hardware-rev-4.0a.yaml@dev

esphome:
  name: fancontroller-r4-0b
  friendly_name: fancontroller
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  name_add_mac_suffix: true
  project:
    name: zeroflow.fancontroller-rev4-0b
    version: "4.0"

# Enable logging
logger:
  id: logger_component
  level: INFO

# Native API for Home Assistant
api:
  id: api_component

# Local OTA only, no update source for this board
ota:
  - platform: esphome
    id: ota_esphome

wifi:
  id: wifi_component
  # Enable fallback hotspot in case wifi connection fails
  ap:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device
captive_portal:
  id: captive_portal_component

# Sets up the improv via serial client for Wi-Fi provisioning.
improv_serial:
