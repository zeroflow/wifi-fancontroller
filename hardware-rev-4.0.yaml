# WiFi Fan Controller Hardware Package - Revision 4.0
# Hardware: ESP32-C6-MINI-1-N4 (4MB flash), esp32-c6-devkitm-1 board
# This package contains all hardware-specific configuration
#
# This is the default hardware package for WiFi configs. It includes
# hardware-rev-4.0-base.yaml for everything else and only adds the WiFi
# status LED callbacks. Configs without WiFi import hardware-rev-4.0-base.yaml
# instead.
#
# Usage (local):
#   packages:
#     fancontroller: !include hardware-rev-4.0.yaml
#
# Usage (GitHub):
#   packages:
#     fancontroller: github://zeroflow/wifi-fancontroller/hardware-rev-4.0.yaml@main

packages:
  rev_4_0_base: !include hardware-rev-4.0-base.yaml

# WiFi status callbacks
wifi:
  on_connect:
    - then:
        - lambda: |-
            auto call = id(status_led).turn_on();
            call.set_rgb(0.0, 1.0, 0.0); // green
            call.set_brightness(0.5);
            call.set_effect("none");
            call.perform();
        - delay: 60s
        - lambda: |-
            auto call = id(status_led).turn_on();
            call.set_rgb(0.0, 1.0, 0.0); // green
            call.set_brightness(0.1);
            call.set_effect("none");
            call.perform();

  on_disconnect:
    - then:
        - lambda: |-
            auto call = id(status_led).turn_on();
            call.set_rgb(1.0, 0.0, 0.0); // red
            call.set_brightness(0.25);
            call.set_effect("pulse");
            call.perform();
