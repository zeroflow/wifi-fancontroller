# Opt-in per-fan profiles on Rev 3.3. Use one temperature controller per build.
# Select Manual for fixed speeds; active curves overwrite speed writes each tick.
packages:
  hardware:
    url: https://github.com/zeroflow/wifi-fancontroller
    ref: main
    files: [hardware-rev-3.3.yaml]
  per_fan:
    url: https://github.com/zeroflow/wifi-fancontroller
    ref: main
    files: [modules/temperature_curve_per_fan.yaml]

esphome:
  name: per-fan-controller
  friendly_name: Per Fan Controller

esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Optional local web controls (profiles also appear in Home Assistant).
web_server:
  port: 80

# Initial Custom rules: Fan 2 reaches 60% at 30 C.
# Select Custom for Fan 2 to use these points without replacing them.
substitutions:
  fan2_curve_speed3: "60"
